# Fast checks, on every push to main.
#
# These are the checks that catch the failures this course has actually had:
#
#   - Lecture 13 (2026-10-08) asked students to run code on data that nothing
#     had told them to load. The deck rendered fine, because its hidden setup
#     chunk loads the data; only the student path was broken, and that was not
#     discovered until the room was full.
#   - Greek letters written through a script turned into control characters
#     three separate times, producing garbled text on the rendered slides.
#
# Both are checked by R_scripts/check_deck_student_code.R, which runs locally in
# about 25 seconds. This workflow just makes sure it is never skipped.
#
# It also rebuilds the class example tables, which verifies their stopifnot()
# assertions and, because the type-and-run blocks download from raw.github URLs,
# incidentally proves those URLs are still live.
#
# Package drift is deliberately NOT tested here. See render.yaml.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # What the student path needs, which is NOT what renv::dependencies()
      # reports. The type-and-run blocks carry `eval: false` so the deck does
      # not run student code at render time, and renv skips chunks it will not
      # evaluate, so it never sees Lecture 26's tidyverse and reprex. The
      # checker runs those blocks, so it needs them.
      #
      # Keep this list in step with Rscript -e 'source(
      #   "R_scripts/check_deck_student_code.R"); deck_packages()'
      # plus dplyr and tibble for make_class_examples.R. The first step below
      # fails with the missing names if it drifts again.
      #
      # Not renv::restore(): the lockfile pulls sf and terra for the data
      # download scripts, and building those means GDAL and PROJ for no gain.
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::tidyverse
            any::bbmle
            any::emdbook
            any::reprex

      # Same script you can run locally with:
      #   Rscript R_scripts/ci_checks.R
      - name: Control characters, and the student code path
        run: Rscript R_scripts/ci_checks.R

      - name: Class example tables rebuild, and their checks pass
        run: Rscript -e 'source("data/class_examples/make_class_examples.R")'

      # If this fails, a file in data/class_examples was edited by hand, or the
      # raw data changed underneath it. Either way the committed tables no
      # longer match the script that is supposed to produce them.
      - name: Committed tables match the script that makes them
        run: git diff --exit-code --ignore-cr-at-eol -- data/class_examples
